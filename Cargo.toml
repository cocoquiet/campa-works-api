[package]
name = "campa-works-api"
version = "0.1.0"
edition = "2024"

description = "Backend API for Campa Works"
authors = ["ModakStudio"]
homepage = "https://github.com/ModakStudio/campa-works-api"
repository = "https://github.com/ModakStudio/campa-works-api"
license = "Apache-2.0"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

dotenvy = "0.15"

diesel = { version = "2.3", features = [
    "postgres",
    "chrono",
    "uuid"
] }
deadpool-diesel = { version = "0.6", features = ["postgres"] }
diesel-derive-enum = { version = "2.1", features = ["postgres"] }

chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"

jsonwebtoken = "9"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

argon2 = "0.5"
password-hash = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.wix]
upgrade-guid = "AE0C095F-FA24-4A40-9726-2848FA216CCB"
path-guid = "0EF118FE-7FBA-4566-9DE1-E4C5E66E1708"
license = false
eula = false
